install_shop_with_modules:
  cache:
    prepared_shop: false
  composer:
    transform: |
      {
          "require": {
              "oxid-esales/oxideshop-ce": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/twig-admin-theme": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/twig-theme": "{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/developer-tools": "{{ .Data.global.composer.dev_ref }}",
              "fresh-advance/sitemap": "dev-{{ .Github.RefName }}"
          },
          "repositories": {
            "fresh-advance/sitemap": {
              "type": "git",
              "url": "https://github.com/Fresh-Advance/Sitemap.git"
            }
          }
      }
  custom_script_container: |
    vendor/bin/oe-console oe:database:reset --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
    vendor/bin/oe-console oe:module:activate fa_sitemap
    vendor/bin/oe-console oe:theme:activate twig

runscript: &runscript
  matrix:
    script: |
      [
        "fa_sitemap:tests-clover",
      ]
  fa_sitemap:
    path: 'vendor/fresh-advance/sitemap'

runslim:
  <<: *runscript
  matrix:
    script: |
      [
        "fa_sitemap:phpstan",
        "fa_sitemap:phpmd",
        "fa_sitemap:phpcs",
      ]

sonarcloud:
  matrix:
    testplan: '["-"]'
  strip_path: '/var/www/vendor/fresh-advance/sitemap/'
  project_name: 'Sitemap'
  project_key: 'Fresh-Advance_Sitemap'
  organization: 'fresh-advance'
  parameters: |
    -Dsonar.language=php
    -Dsonar.scm.provider=git
    -Dsonar.sources=src
    -Dsonar.tests=tests
